<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Document Details – DBDRS</title>
  <link rel="stylesheet" href="../../css/styles.css"/>
  <style>
    .details-card {
      background: var(--navy);
      color: var(--white);
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      margin: 2rem auto;
    }
    .details-card h2 {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .details-card label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
      color: #ccd6e8;
    }
    .details-card .field-value {
      background: var(--white);
      color: var(--navy);
      border-radius: 6px;
      padding: 0.55rem 0.85rem;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      min-height: 2.2rem;
    }
    .details-card .field-value.textarea {
      min-height: 80px;
    }
    .btn-approve {
      display: block;
      width: calc(100% + 4rem);
      margin: 1.5rem -2rem -2rem;
      padding: 1rem;
      background: var(--gold);
      color: var(--white);
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 0 0 12px 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-approve:hover { background: #c49a2a; }
    .back-link {
      display: inline-block;
      margin: 1.5rem 2rem 0;
      color: var(--navy);
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 600;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="header">
    <img src="../../assets/Northern_Samar_Provincial_Logo.png" alt="Logo" class="header-logo"/>
    <span class="header-title">Digital Barangay Document<br/>Request System</span>
  </header>

  <nav class="nav-bar">
    <a href="dashboard.html" class="nav-link active">HOME</a>
    <a href="manage-requests.html" class="nav-link">MANAGE REQUESTS</a>
    <a href="users.html" class="nav-link">USERS</a>
    <a href="archives.html" class="nav-link">ARCHIVES</a>
  </nav>

  <a href="dashboard.html" class="back-link">← Back</a>

  <main class="main-content">
    <div class="details-card">
      <h2>Document Details</h2>

      <label>Document Type</label>
      <div class="field-value" id="detail-type"></div>

      <label>Full Name (Last Name, First Name MI.)</label>
      <div class="field-value" id="detail-name"></div>

      <label>Address</label>
      <div class="field-value" id="detail-email"></div>

      <label>Purpose of Request</label>
      <div class="field-value textarea" id="detail-purpose"></div>

      <button class="btn-approve" id="btn-approve">Approve</button>
    </div>
  </main>

  <footer class="footer">
    <a href="#" class="footer-link">Privacy Policy</a>
    <span class="footer-sep">|</span>
    <a href="#" class="footer-link">Terms of Service</a>
  </footer>

  <script src="../../js/auth.js"></script>
  <script src="../../js/document-details.js"></script>
</body>
</html>
