  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – Digital Barangay Document Request System</title>
  <link rel="stylesheet" href="../css/styles.css"/>
</head>
<body>

  <div class="header">
    <img src="#" alt="piksur" class="header-logo"/>
    <div class="header-title">Digital Barangay Document<br>Request System</div>
  </div>
  
  <div class="content">
    <div class="card">
      <h2 class="card-title">Sign Up</h2>

      <div class="form-group">
        <label for="signup-name">Full name</label>
        <input type="text" id="signup-name" placeholder="Enter Name"/>
      </div>

      <div class="form-group">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" placeholder="Enter Email"/>
      </div>

      <div class="form-group">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="Enter Password"/>
      </div>

      <div class="form-group">
        <label for="signup-confirm">Confirm Password</label>
        <input type="password" id="signup-confirm" placeholder="Confirm Password"/>
      </div>

      <button class="btn-primary" id="btn-signup">Sign Up</button>

      <p class="switch-link">
        Already have an account? <a href="login.html">Log In here</a>
      </p>
    </div>

    <div class="footer-links">
      <a>Privacy Policy</a>
      <a>Terms of Service</a>
    </div>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
