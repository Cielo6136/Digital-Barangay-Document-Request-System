<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tracking Progress – DBDRS</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <style>
    .tracker { margin-top: 20px; }
    .tracker-step {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .tracker-step:last-child { border-bottom: none; }
    .step-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .step-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .step-icon.pending    { background: rgba(201,168,76,0.2); }
    .step-icon.active     { background: rgba(201,168,76,0.4); }
    .step-icon.done       { background: rgba(100,200,120,0.3); }
    .step-label {
      color: var(--text-light);
      font-size: 14px;
      font-weight: 600;
    }
    .step-label.active { color: var(--gold); }
    .step-label.done   { color: #6dc87a; }
    .step-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid var(--text-muted);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-checkbox.checked {
      border-color: var(--gold);
      background: var(--gold);
    }
    .step-checkbox.checked::after {
      content: '✓';
      color: var(--navy-dark);
      font-size: 12px;
      font-weight: 700;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--gold);
      color: var(--navy-dark);
      border: none;
      border-radius: 5px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 16px;
      text-decoration: none;
    }
    .back-btn:hover { background: var(--gold-hover); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <img src="../assets/Northern_Samar_Provincial_Logo.png" alt="Logo" class="header-logo"/>
    <span class="header-title">Digital Barangay Document<br>Request System</span>
    <nav class="nav">
      <a href="dashboard.html">HOME</a>
      <a href="request-form.html">REQUEST</a>
      <a href="profile.html">PROFILE</a>
    </nav>
  </div>

  <div class="content" style="max-width: 520px;">
    <div class="card">
      <a class="back-btn" href="activities.html">&#8592; Back</a>

      <h2 style="color: var(--white); font-size: 20px; font-weight: 800; margin-bottom: 4px;">
        Tracking Progress
      </h2>
      <p style="color: var(--text-muted); font-size: 12px; margin-bottom: 20px;">
        Step by step journey of your document request
      </p>

      <!-- Document name populated by JS -->
      <div style="background: var(--navy-light); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px;">
        <p style="color: var(--text-light); font-size: 11px; margin-bottom: 2px;">Document</p>
        <p id="doc-name" style="color: var(--white); font-size: 15px; font-weight: 700;">—</p>
      </div>

      <div class="tracker">

        <div class="tracker-step">
          <div class="step-left">
            <div class="step-icon" id="icon-approval">⏳</div>
            <span class="step-label" id="label-approval">Approval</span>
          </div>
          <div class="step-checkbox" id="check-approval"></div>
        </div>

        <div class="tracker-step">
          <div class="step-left">
            <div class="step-icon" id="icon-processing">⚙️</div>
            <span class="step-label" id="label-processing">Processing</span>
          </div>
          <div class="step-checkbox" id="check-processing"></div>
        </div>

        <div class="tracker-step">
          <div class="step-left">
            <div class="step-icon" id="icon-pickup">📦</div>
            <span class="step-label" id="label-pickup">Ready for Pickup</span>
          </div>
          <div class="step-checkbox" id="check-pickup"></div>
        </div>

        <div class="tracker-step">
          <div class="step-left">
            <div class="step-icon" id="icon-completed">✅</div>
            <span class="step-label" id="label-completed">Completed</span>
          </div>
          <div class="step-checkbox" id="check-completed"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/status.js"></script>
</body>
</html>
