<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Digital Barangay Document Request System</title>
  <link rel="stylesheet" href="../css/styles.css"/>
</head>
<body>

  <div class="header">
    <img src="../assets/Northern_Samar_Provincial_Logo.png" alt="piksur" class="header-logo"/>
    <div class="header-title">Digital Barangay Document<br>Request System</div>
  </div>

  <div class="content">
    <div class="card">
      <h2 class="card-title">Log In</h2>

      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="Enter Email"/>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Enter Password"/>
      </div>

      <button class="btn-primary" id="btn-login">Log In</button>

      <p class="switch-link">
        Don't have an account? <a href="signup.html">Create here</a>
      </p>
    </div>



    <div class="footer-links">
      <a>Privacy Policy</a>
      <a>Terms of Service</a>
    </div>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
